<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="container__left__container">
                <h4>Your Result</h4>
                <div class="container__left__container__score">
                    <span>76</span>
                    <p>of 100</p>
                </div>
                <h3>Great</h3>
                <p>You scored higher than 65% of the people who have taken 
                    these tests.
                </p>
            </div>
            <div class="container__right__container">
                <h4>Summary</h4>
                <div class="container__right__container__subject">
                    <div class="container__right__container__subject--reaction">
                        <div class="subject__text">
                            <img src="assets/icon-reaction.svg" alt="">
                            <span>Reaction</span>
                        </div>
                        <div class="score">
                            <span class="obtained__score">80 </span> 
                            <span class="total__score">/ 100</span>
                        </div>
                    </div>
                    <div class="container__right__container__subject--memory">
                         <div class="subject__text">
                            <img src="assets/icon-memory.svg" alt="">
                            <span class="">Memory</span>
                        </div>
                        <div class="score">
                            <span class="obtained__score">80 </span> 
                            <span class="total__score">/ 100</span>
                        </div>
                    </div>
                    <div class="container__right__container__subject--verbal">
                         <div class="subject__text">
                            <img src="assets/icon-verbal.svg" alt="">
                            <span>Verbal</span>
                        </div>
                        <div class="score">
                            <span class="obtained__score">80 </span> 
                            <span class="total__score">/ 100</span>
                        </div>
                    </div>
                    <div class="container__right__container__subject--visual">  
                         <div class="subject__text">
                            <img src="assets/icon-visual.svg" alt="">
                            <span>Visual</span>
                        </div>
                        <div class="score">
                            <span class="obtained__score">80 </span> 
                            <span class="total__score">/ 100</span>
                        </div>
                    </div>
                </div>
                <button>Continue</button>
            </div>
        </div>
    </main>
</body>
</html>
